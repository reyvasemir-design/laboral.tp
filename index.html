<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Más allá de la teoría — Pilar + 5</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0b0f1a;
      background-image:
        radial-gradient(circle at 15% 25%, rgba(0, 200, 255, 0.15) 0%, transparent 55%),
        radial-gradient(circle at 85% 75%, rgba(255, 0, 200, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(120, 80, 255, 0.05) 0%, transparent 70%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', sans-serif;
      padding: 2rem 1rem;
      color: #e0e6f0;
    }

    .app {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* HEADER */
    .header {
      text-align: center;
      margin-bottom: 2.5rem;
      animation: fadeDown 0.8s ease both;
    }
    .header .eyebrow {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #8a9bb5;
      background: rgba(255,255,255,0.05);
      display: inline-block;
      padding: 0.25rem 1.2rem;
      border-radius: 100px;
      border: 1px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(4px);
      margin-bottom: 0.8rem;
    }
    .header h1 {
      font-size: clamp(1.8rem, 5vw, 3.2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #00d4ff, #a855f7, #ff4ecd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 12px rgba(0,212,255,0.4));
    }
    .header .sub {
      font-size: 1rem;
      color: #b0c0d8;
      font-weight: 400;
      margin-top: 0.2rem;
    }
    .header .hint {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      color: #a0b5d0;
      margin-top: 1rem;
      padding: 0.4rem 1.2rem;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 100px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(6px);
    }
    .header .hint svg { opacity: 0.6; animation: pulseIcon 2s infinite; }

    @keyframes pulseIcon {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.3); opacity: 1; }
    }
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ESCENA */
    .radial-scene {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1400px;
      perspective-origin: 50% 45%;
      min-height: 700px;
      position: relative;
    }

    .rings-container {
      position: relative;
      width: 620px;
      height: 620px;
      display: flex;
      justify-content: center;
      align-items: center;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .rings-container.is-rotated {
      transform: rotateX(4deg) rotateY(6deg) rotateZ(1deg);
    }

    /* NODO CENTRAL */
    .center-node {
      position: absolute;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #1e2a3a, #0f1520);
      box-shadow:
        0 0 30px rgba(0,212,255,0.4),
        0 0 60px rgba(168,85,247,0.2),
        0 12px 40px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      cursor: pointer;
      z-index: 10;
      transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.4s;
      transform: translateZ(20px);
      padding: 0 12px;
      border: 1px solid rgba(0,212,255,0.4);
    }
    .center-node:hover {
      transform: translateZ(40px) scale(1.04);
      box-shadow: 0 0 50px rgba(0,212,255,0.6), 0 0 90px rgba(168,85,247,0.3), 0 20px 60px rgba(0,0,0,0.6);
    }
    .center-node .title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
      text-shadow: 0 0 8px rgba(0,212,255,0.5);
    }
    .center-node .title span {
      display: block;
      font-weight: 400;
      font-size: 0.7rem;
      color: #b0c0d8;
      margin-top: 2px;
    }

    .center-ring-pulse {
      position: absolute;
      width: 155px;
      height: 155px;
      border-radius: 50%;
      border: 2px solid rgba(0,212,255,0.3);
      animation: ringPulse 2.8s ease-in-out infinite;
      pointer-events: none;
      z-index: 1;
    }
    @keyframes ringPulse {
      0%   { transform: scale(0.9); opacity: 0.8; }
      50%  { transform: scale(1.3); opacity: 0.1; }
      100% { transform: scale(0.9); opacity: 0.8; }
    }

    /* ANILLOS */
    .ring {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      transform-style: preserve-3d;
      pointer-events: none;
      width: 100%;
      height: 100%;
    }
    .ring .node-wrap {
      position: absolute;
      pointer-events: auto;
      transform-style: preserve-3d;
      transition: opacity 0.4s;
    }

    /* NODOS */
    .ring .node {
      width: 115px;
      padding: 0.85rem 0.7rem;
      border-radius: 18px;
      background: rgba(20,28,45,0.92);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 0 15px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.05);
      text-align: center;
      cursor: pointer;
      transition:
        transform 0.35s cubic-bezier(0.34,1.56,0.64,1),
        box-shadow 0.3s,
        border-color 0.3s,
        background 0.3s;
      transform: translateZ(0);
      font-family: inherit;
      color: #e0e6f0;
    }
    .ring .node:hover {
      transform: translateZ(28px) scale(1.06);
      background: rgba(30,40,65,0.97);
      border-color: rgba(0,212,255,0.6);
      box-shadow: 0 0 25px rgba(0,212,255,0.3), 0 16px 48px rgba(0,0,0,0.6);
    }
    .ring .node.leaf { cursor: default; background: rgba(15,22,35,0.82); border-color: rgba(255,255,255,0.08); }
    .ring .node.leaf:hover { transform: translateZ(10px); box-shadow: 0 0 12px rgba(0,212,255,0.2); }

    .ring .node.quote-node {
      background: rgba(30,20,35,0.92);
      border-left: 4px solid #ff4ecd;
      text-align: left;
      padding: 0.75rem 0.8rem;
      width: 125px;
      cursor: default;
    }
    .ring .node.quote-node:hover {
      transform: translateZ(20px) scale(1.04);
      box-shadow: 0 0 25px rgba(255,78,205,0.4);
    }

    .ring .node .label { font-size: 0.53rem; text-transform: uppercase; letter-spacing: 0.08em; color: #8a9bb5; margin-bottom: 2px; }
    .ring .node .title { font-size: 0.88rem; font-weight: 600; color: #fff; line-height: 1.2; }
    .ring .node .sub   { font-size: 0.7rem; color: #b0c0d8; line-height: 1.3; margin-top: 2px; }
    .ring .node .quote-text   { font-size: 0.74rem; font-style: italic; color: #d0d8e8; line-height: 1.4; }
    .ring .node .quote-author { font-size: 0.58rem; font-weight: 600; color: #ff4ecd; text-transform: uppercase; letter-spacing: 0.06em; margin-top: 4px; }
    .ring .node .quote-mark   { font-size: 1.4rem; color: #ff4ecd; opacity: 0.5; line-height: 0.8; display: block; font-family: Georgia, serif; }

    /* EXPANDIBLE */
    .ring .node.expandable { border-bottom: 2px solid rgba(0,212,255,0.4); }
    .ring .node.expandable.pink { border-bottom-color: rgba(255,78,205,0.5); }
    .ring .node.expandable .chevron {
      display: inline-block;
      margin-left: 4px;
      transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
      font-size: 0.78rem;
      color: #8a9bb5;
    }
    .ring .node.expandable.open .chevron   { transform: rotate(180deg) scale(1.2); color: #00d4ff; }
    .ring .node.expandable.pink.open .chevron { color: #ff4ecd; }
    .ring .node.expandable.open {
      box-shadow: 0 0 0 4px rgba(0,212,255,0.2), 0 0 25px rgba(0,212,255,0.3);
      border-color: rgba(0,212,255,0.5);
    }
    .ring .node.expandable.pink.open {
      box-shadow: 0 0 0 4px rgba(255,78,205,0.2), 0 0 25px rgba(255,78,205,0.3);
      border-color: rgba(255,78,205,0.5);
    }

    @keyframes ringAppear {
      0%   { opacity: 0; transform: translate(-50%,-50%) rotateY(90deg) scale(0.6); }
      60%  { opacity: 0.9; transform: translate(-50%,-50%) rotateY(-8deg) scale(1.04); }
      100% { opacity: 1; transform: translate(-50%,-50%) rotateY(0deg) scale(1); }
    }
    .ring.appear { animation: ringAppear 0.65s cubic-bezier(0.23,1,0.32,1) both; }

    .particle-canvas {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none; z-index: 0;
    }

    /* BOTÓN DE ENLACE */
    .btn-link {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.8rem 2rem;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: #00d4ff;
      background: rgba(0, 212, 255, 0.08);
      border: 1px solid rgba(0, 212, 255, 0.4);
      border-radius: 100px;
      text-decoration: none;
      backdrop-filter: blur(6px);
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.15);
      transition: all 0.3s ease;
    }
    .btn-link:hover {
      background: rgba(0, 212, 255, 0.15);
      border-color: rgba(0, 212, 255, 0.7);
      box-shadow: 0 0 35px rgba(0, 212, 255, 0.4);
      transform: translateY(-2px);
    }
    .btn-link:active {
      transform: translateY(0);
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
    }

    /* RESPONSIVE */
    @media (max-width: 760px) {
      .rings-container { width: 400px; height: 400px; }
      .center-node { width: 95px; height: 95px; }
      .center-node .title { font-size: 0.85rem; }
      .center-ring-pulse { width: 115px; height: 115px; }
      .ring .node { width: 85px; padding: 0.5rem 0.4rem; }
      .ring .node .title { font-size: 0.72rem; }
      .ring .node .sub { font-size: 0.6rem; }
      .ring .node.quote-node { width: 95px; }
      .ring .node .quote-text { font-size: 0.63rem; }
    }
    @media (max-width: 480px) {
      .rings-container { width: 310px; height: 310px; }
      .center-node { width: 78px; height: 78px; }
      .center-node .title { font-size: 0.72rem; }
      .center-ring-pulse { width: 94px; height: 94px; }
      .ring .node { width: 68px; padding: 0.3rem 0.25rem; border-radius: 12px; }
      .ring .node .title { font-size: 0.6rem; }
      .ring .node .sub { font-size: 0.5rem; }
      .ring .node.quote-node { width: 78px; }
      .ring .node .quote-text { font-size: 0.54rem; }
    }
  </style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="eyebrow">TPE N.º 2 · Psicología Organizacional · Equipo Pilar + 5</div>
    <h1>Más allá de la teoría</h1>
    <p class="sub">Introduccion, Desarrollo y Conclusion</p>
    <span class="hint">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
        <circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.5"/>
        <path d="M8 2v6l3 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      Haz clic en los nodos con borde para expandir
    </span>
  </header>

  <div class="radial-scene" id="radialScene">
    <div class="rings-container" id="ringsContainer">
      <div class="center-node" id="centerNode" role="button" tabindex="0">
        <div class="title">Más allá de la teoría<span>Análisis</span></div>
      </div>
      <div class="center-ring-pulse"></div>
      <div id="ringsWrapper" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;"></div>
      <canvas class="particle-canvas" id="particleCanvas"></canvas>
    </div>
  </div>

  <!-- Botón de enlace añadido -->
  <a href="https://drive.google.com/file/d/1QG7uMsYIUdRB_deE61Pang_VDm0O9yO-/view?usp=drive_link" target="_blank" rel="noopener noreferrer" class="btn-link">
    Ver documento completo
  </a>
</div>

<script>
  // ── DATOS ─────────────────────────────────────────────────────
  const data = {
    id: 'root',
    children: [
      {
        id: 'eje1', label: 'Eje I', title: 'Contexto y desarrollo', sub: 'Paradigmas organizacionales',
        children: [
          { id: 'e1_1', label: 'Consultora',   title: 'Naranja y Verde',      sub: 'Eficiencia de negocio y horizontalidad' },
          { id: 'e1_2', label: 'Inmobiliaria', title: 'Ámbar y Verde',        sub: 'Control administrativo vs. empatía' },
          { id: 'e1_3', label: 'Gastronómico', title: 'Transición Naranja',   sub: 'Jerarquía tradicional y digitalización' }
        ]
      },
      {
        id: 'eje2', label: 'Eje II', title: 'Clima organizacional y dinámicas de interacción cognitiva ', sub: 'Comunicación y vínculos',
        children: [
          { id: 'e2_1', label: 'Consultora',   title: 'Diálogo Constante',  sub: 'Reuniones diarias, tensiones prevenidas' },
          { id: 'e2_2', label: 'Inmobiliaria', title: 'Fricción Sistémica', sub: 'Reglas rígidas vs. orientación a cierres' },
          { id: 'e2_3', label: 'Gastronómico', title: 'Control Vertical',   sub: 'Estabilidad alineada al dueño' }
        ]
      },
      {
        id: 'eje3', label: 'Eje III', title: 'El factor humano: selección, formación y cultura ', sub: 'Cultura de innovación',
        children: [
          { id: 'e3_1', label: 'Consultora',   title: 'Fidelización',       sub: 'Mentalidad flexible y pensamiento crítico' },
          { id: 'e3_2', label: 'Inmobiliaria', title: 'Habilidades Soft',   sub: 'Entrenamiento anual socioemocional' },
          { id: 'e3_3', label: 'Gastronómico', title: 'Moldear Perfiles',   sub: 'Reclutamiento de jóvenes sin experiencia' }
        ]
      },
      {
        id: 'eje4', label: 'Eje IV', title: 'La salud mental', sub: 'Rol profiláctico',
        children: [
          { id: 'e4_1', label: 'Mental Care',  title: 'Consultora',        sub: 'Contención del desgaste emocional' },
          { id: 'e4_2', label: 'Intervención', title: 'Psicólogo', sub: 'Dinamización de matrices vinculares' }
        ]
      },
      {
        id: 'citas', label: 'Testimonios', title: 'Voces', sub: 'Entrevistas a referentes',
        children: [
          { id: 'c1', quote: 'No creemos en la retención... creemos en la fidelización.', author: 'CEO Consultora' },
          { id: 'c2', quote: 'Señala el error ajeno y pierde de vista que los errores de su equipo son propios.', author: 'CEO Broker Inmobiliario' },
          { id: 'c3', quote: 'Si apuntan todos para el mismo lado, a todos les va a ir mejor.', author: 'Founder Gastronomico' }
        ]
      }
    ]
  };

  // ── REFERENCIAS ───────────────────────────────────────────────
  const container    = document.getElementById('ringsContainer');
  const centerNode   = document.getElementById('centerNode');
  const ringsWrapper = document.getElementById('ringsWrapper');
  const canvas       = document.getElementById('particleCanvas');
  const ctx          = canvas.getContext('2d');

  let particles = [], animFrame = null;
  let expandedNodes = new Set();

  // ── PARTÍCULAS ────────────────────────────────────────────────
  function initParticles() {
    const r = container.getBoundingClientRect();
    canvas.width  = r.width  || 620;
    canvas.height = r.height || 620;
    particles = [];
    for (let i = 0; i < 32; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 2 + 0.8,
        vx: (Math.random() - 0.5) * 0.35,
        vy: (Math.random() - 0.5) * 0.35,
        color: `rgba(0,212,255,${(Math.random() * 0.25 + 0.08).toFixed(2)})`
      });
    }
    if (animFrame) cancelAnimationFrame(animFrame);
    drawParticles();
  }

  function drawParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const d  = Math.sqrt(dx*dx + dy*dy);
        if (d < 110) {
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = `rgba(0,212,255,${(0.07*(1-d/110)).toFixed(3)})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }
    particles.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2);
      ctx.fillStyle = p.color;
      ctx.fill();
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > canvas.width)  p.vx *= -1;
      if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
    });
    animFrame = requestAnimationFrame(drawParticles);
  }

  // ── HELPERS DE POSICIÓN ───────────────────────────────────────
  function getContainerSize() {
    const r = container.getBoundingClientRect();
    return Math.min(r.width, r.height) || 620;
  }

  function polarToXY(angleDeg, radiusPx) {
    const rad = (angleDeg - 90) * Math.PI / 180;
    return { x: radiusPx * Math.cos(rad), y: radiusPx * Math.sin(rad) };
  }

  // ── CONSTRUIR ANILLO PRIMARIO ─────────────────────────────────
  function buildRings() {
    ringsWrapper.querySelectorAll('.ring').forEach(r => r.remove());

    const children = data.children;
    if (!children.length) return;

    const size   = getContainerSize();
    const radius = size * 0.38;

    const ringDiv = document.createElement('div');
    ringDiv.className = 'ring appear';
    ringsWrapper.appendChild(ringDiv);

    const total     = children.length;
    const angleStep = 360 / total;

    children.forEach((child, i) => {
      const angle = i * angleStep;
      const { x, y } = polarToXY(angle, radius);

      const wrap = document.createElement('div');
      wrap.className = 'node-wrap';
      wrap.style.left      = `calc(50% + ${x}px)`;
      wrap.style.top       = `calc(50% + ${y}px)`;
      wrap.style.transform = 'translate(-50%, -50%)';
      wrap.style.zIndex    = '2';

      const hasChildren  = child.children && child.children.length > 0;
      const hasQuotes    = hasChildren && child.children[0].quote;
      const isExpandable = hasChildren;

      const node = document.createElement('div');
      node.className = 'node expandable';
      if (hasQuotes) node.classList.add('pink');

      node.innerHTML = `
        <div class="label">${child.label || ''}</div>
        <div class="title">${child.title || ''}</div>
        <div class="sub">${child.sub || ''}</div>
        <span class="chevron">▼</span>
      `;
      node.dataset.id       = child.id;
      node.dataset.children = JSON.stringify(child.children);
      node.dataset.angle    = angle;

      node.setAttribute('role', 'button');
      node.setAttribute('tabindex', '0');
      node.addEventListener('click', e => { e.stopPropagation(); toggleNode(node, child.id); });
      node.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); node.click(); } });

      wrap.appendChild(node);
      ringDiv.appendChild(wrap);
    });

    setTimeout(initParticles, 100);
  }

  // ── TOGGLE ────────────────────────────────────────────────────
  function toggleNode(nodeEl, id) {
    nodeEl.classList.contains('open') ? closeNode(nodeEl, id) : openNode(nodeEl, id);
  }

  function openNode(nodeEl, id) {
    if (nodeEl.classList.contains('open')) return;

    let children = [];
    try { children = JSON.parse(nodeEl.dataset.children || '[]'); } catch(e) {}
    if (!children.length) return;

    nodeEl.classList.add('open');
    expandedNodes.add(id);

    const ringId = 'ring-' + id;
    const ringDiv = document.createElement('div');
    ringDiv.id        = ringId;
    ringDiv.className = 'ring appear';
    ringDiv.dataset.parentId = id;
    ringsWrapper.appendChild(ringDiv);

    const size = getContainerSize();
    const childRadius = size * 0.21;

    const parentAngle = parseFloat(nodeEl.dataset.angle || 0);
    const parentRadius = size * 0.38;
    const parentPos   = polarToXY(parentAngle, parentRadius);

    const total     = children.length;
    const spreadDeg = Math.min(110, total * 35);
    const startAngle = parentAngle - spreadDeg / 2;
    const angleStep = total > 1 ? spreadDeg / (total - 1) : 0;

    children.forEach((child, i) => {
      const angle = total > 1 ? startAngle + i * angleStep : parentAngle;
      const { x, y } = polarToXY(angle, parentRadius + childRadius);

      const wrap = document.createElement('div');
      wrap.className   = 'node-wrap';
      wrap.style.left  = `calc(50% + ${x}px)`;
      wrap.style.top   = `calc(50% + ${y}px)`;
      wrap.style.transform = 'translate(-50%, -50%)';
      wrap.style.zIndex = '3';

      const node = document.createElement('div');

      if (child.quote) {
        node.className = 'node quote-node';
        node.innerHTML = `
          <span class="quote-mark">"</span>
          <div class="quote-text">${child.quote}</div>
          <div class="quote-author">${child.author || ''}</div>
        `;
      } else {
        node.className = 'node leaf';
        node.innerHTML = `
          <div class="label">${child.label || ''}</div>
          <div class="title">${child.title || ''}</div>
          <div class="sub">${child.sub || child.detail || ''}</div>
        `;
      }

      wrap.appendChild(node);
      ringDiv.appendChild(wrap);
    });

    container.classList.add('is-rotated');
    nodeEl.dataset.childRingId = ringId;
    setTimeout(initParticles, 200);
  }

  function closeNode(nodeEl, id) {
    if (!nodeEl.classList.contains('open')) return;
    const ring = document.getElementById(nodeEl.dataset.childRingId || '');
    if (ring) ring.remove();
    nodeEl.classList.remove('open');
    expandedNodes.delete(id);
    if (!expandedNodes.size) container.classList.remove('is-rotated');
    setTimeout(initParticles, 200);
  }

  // ── INIT ──────────────────────────────────────────────────────
  function init() {
    const r = container.getBoundingClientRect();
    canvas.width  = r.width  || 620;
    canvas.height = r.height || 620;

    buildRings();

    centerNode.addEventListener('click', () => {
      const open = document.querySelectorAll('.ring .node.expandable.open');
      if (open.length) {
        open.forEach(n => { if (n.dataset.id) closeNode(n, n.dataset.id); });
      }
    });

    window.addEventListener('resize', () => {
      const r2 = container.getBoundingClientRect();
      canvas.width  = r2.width  || 620;
      canvas.height = r2.height || 620;
      buildRings();
    });
  }

  document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
