<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Más allá de la teoría — Pilar + 5</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
  <style>
    /* ============================================================
       RESET Y BASE (tema oscuro futurista)
    ============================================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0b0f1a;
      background-image:
        radial-gradient(circle at 15% 25%, rgba(0, 200, 255, 0.15) 0%, transparent 55%),
        radial-gradient(circle at 85% 75%, rgba(255, 0, 200, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(120, 80, 255, 0.05) 0%, transparent 70%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', sans-serif;
      padding: 2rem 1rem;
      margin: 0;
      color: #e0e6f0;
    }

    /* Contenedor principal centrado */
    .app {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* ============================================================
       HEADER (estilo neón sobre fondo oscuro)
    ============================================================ */
    .header {
      text-align: center;
      margin-bottom: 2.5rem;
      animation: fadeDown 0.8s ease both;
    }

    .header .eyebrow {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #8a9bb5;
      background: rgba(255, 255, 255, 0.05);
      display: inline-block;
      padding: 0.25rem 1.2rem;
      border-radius: 100px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(4px);
      margin-bottom: 0.8rem;
    }

    .header h1 {
      font-size: clamp(1.8rem, 5vw, 3.2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #00d4ff, #a855f7, #ff4ecd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 12px rgba(0, 212, 255, 0.4));
    }

    .header .sub {
      font-size: 1rem;
      color: #b0c0d8;
      font-weight: 400;
      margin-top: 0.2rem;
    }

    .header .hint {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      color: #a0b5d0;
      margin-top: 1rem;
      padding: 0.4rem 1.2rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 100px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(6px);
      transition: transform 0.2s, box-shadow 0.3s, border-color 0.3s;
    }

    .header .hint:hover {
      transform: translateY(-2px) scale(1.02);
      border-color: rgba(0, 212, 255, 0.6);
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
    }

    .header .hint svg {
      opacity: 0.6;
      animation: pulseIcon 2s infinite;
    }

    @keyframes pulseIcon {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.3); opacity: 1; }
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ============================================================
       ESCENA RADIAL 3D (perspectiva global)
    ============================================================ */
    .radial-scene {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1200px;
      perspective-origin: 50% 40%;
      min-height: 580px;
      position: relative;
    }

    .rings-container {
      position: relative;
      width: 520px;
      height: 520px;
      display: flex;
      justify-content: center;
      align-items: center;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
    }

    .rings-container.is-rotated {
      transform: rotateX(4deg) rotateY(6deg) rotateZ(1deg);
    }

    /* ============================================================
       NODO CENTRAL (RAÍZ) - con estilo neón
    ============================================================ */
    .center-node {
      position: absolute;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #1e2a3a, #0f1520);
      box-shadow:
        0 0 30px rgba(0, 212, 255, 0.4),
        0 0 60px rgba(168, 85, 247, 0.2),
        0 12px 40px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      cursor: pointer;
      z-index: 10;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s;
      transform: translateZ(20px) rotateX(0deg) rotateY(0deg);
      will-change: transform;
      padding: 0 12px;
      border: 1px solid rgba(0, 212, 255, 0.4);
      font-family: inherit;
    }

    .center-node:hover {
      transform: translateZ(40px) scale(1.04) rotateX(2deg) rotateY(4deg);
      box-shadow:
        0 0 50px rgba(0, 212, 255, 0.6),
        0 0 90px rgba(168, 85, 247, 0.3),
        0 20px 60px rgba(0, 0, 0, 0.6);
    }

    .center-node:active {
      transform: translateZ(10px) scale(0.96);
    }

    .center-node .title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
      pointer-events: none;
      text-shadow: 0 0 8px rgba(0, 212, 255, 0.5);
    }

    .center-node .title span {
      display: block;
      font-weight: 400;
      font-size: 0.75rem;
      color: #b0c0d8;
      margin-top: 2px;
    }

    .center-ring-pulse {
      position: absolute;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 2px solid rgba(0, 212, 255, 0.3);
      animation: ringPulse 2.8s ease-in-out infinite;
      pointer-events: none;
      z-index: 1;
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.1);
    }

    @keyframes ringPulse {
      0% { transform: scale(0.9); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 0.1; }
      100% { transform: scale(0.9); opacity: 0.8; }
    }

    /* ============================================================
       ANILLOS DE NODOS (disposición circular)
    ============================================================ */
    .ring {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(0deg) translateZ(0);
      transform-style: preserve-3d;
      pointer-events: none;
    }

    .ring .node-wrap {
      position: absolute;
      pointer-events: auto;
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1), opacity 0.4s;
    }

    .ring .node {
      width: 110px;
      padding: 0.8rem 0.6rem;
      border-radius: 18px;
      background: rgba(20, 28, 45, 0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.05);
      text-align: center;
      cursor: pointer;
      transition:
        transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
        box-shadow 0.3s,
        border-color 0.3s,
        background 0.3s;
      transform: translateZ(0) rotateX(0deg) rotateY(0deg);
      will-change: transform;
      font-family: inherit;
      color: #e0e6f0;
    }

    .ring .node:hover {
      transform: translateZ(30px) rotateX(4deg) rotateY(6deg) scale(1.06);
      background: rgba(30, 40, 65, 0.95);
      border-color: rgba(0, 212, 255, 0.6);
      box-shadow: 0 0 25px rgba(0, 212, 255, 0.3), 0 16px 48px rgba(0, 0, 0, 0.6);
    }

    .ring .node:active {
      transform: translateZ(6px) scale(0.94);
    }

    .ring .node.leaf {
      cursor: default;
      background: rgba(15, 22, 35, 0.8);
      border-color: rgba(255, 255, 255, 0.08);
      box-shadow: none;
    }

    .ring .node.leaf:hover {
      transform: translateZ(10px) rotateX(1deg) rotateY(2deg);
      box-shadow: 0 0 12px rgba(0, 212, 255, 0.2);
    }

    .ring .node.quote-node {
      background: rgba(30, 20, 35, 0.9);
      border-left: 4px solid #ff4ecd;
      text-align: left;
      padding: 0.7rem 0.8rem;
      width: 120px;
      cursor: default;
    }

    .ring .node.quote-node:hover {
      transform: translateZ(20px) rotateY(-4deg) scale(1.04);
      box-shadow: 0 0 25px rgba(255, 78, 205, 0.4);
    }

    .ring .node .label {
      font-size: 0.55rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #8a9bb5;
      margin-bottom: 2px;
    }

    .ring .node .title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #ffffff;
      line-height: 1.2;
    }

    .ring .node .sub {
      font-size: 0.7rem;
      color: #b0c0d8;
      line-height: 1.3;
    }

    .ring .node .quote-text {
      font-size: 0.75rem;
      font-style: italic;
      color: #d0d8e8;
      line-height: 1.4;
    }

    .ring .node .quote-author {
      font-size: 0.6rem;
      font-weight: 600;
      color: #ff4ecd;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-top: 4px;
    }

    .ring .node .quote-mark {
      font-size: 1.4rem;
      color: #ff4ecd;
      opacity: 0.5;
      line-height: 0.8;
      display: block;
      font-family: Georgia, serif;
    }

    /* ============================================================
       NODOS DE EXPANSIÓN (con chevron o indicador)
    ============================================================ */
    .ring .node.expandable {
      border-bottom: 2px solid rgba(0, 212, 255, 0.4);
      cursor: pointer;
    }

    .ring .node.expandable.pink {
      border-bottom-color: rgba(255, 78, 205, 0.5);
    }

    .ring .node.expandable .chevron {
      display: inline-block;
      margin-left: 4px;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      font-size: 0.8rem;
      color: #8a9bb5;
    }

    .ring .node.expandable.open .chevron {
      transform: rotate(180deg) scale(1.2);
      color: #00d4ff;
    }

    .ring .node.expandable.pink.open .chevron {
      color: #ff4ecd;
    }

    .ring .node.expandable.open {
      box-shadow: 0 0 0 4px rgba(0, 212, 255, 0.2), 0 0 25px rgba(0, 212, 255, 0.3);
      border-color: rgba(0, 212, 255, 0.5);
    }

    .ring .node.expandable.pink.open {
      box-shadow: 0 0 0 4px rgba(255, 78, 205, 0.2), 0 0 25px rgba(255, 78, 205, 0.3);
      border-color: rgba(255, 78, 205, 0.5);
    }

    /* ============================================================
       ANIMACIONES DE ENTRADA PARA LOS ANILLOS (3D)
    ============================================================ */
    @keyframes ringAppear {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) rotateY(90deg) scale(0.6) translateZ(-80px);
      }
      60% {
        opacity: 0.9;
        transform: translate(-50%, -50%) rotateY(-10deg) scale(1.05) translateZ(20px);
      }
      100% {
        opacity: 1;
        transform: translate(-50%, -50%) rotateY(0deg) scale(1) translateZ(0);
      }
    }

    .ring.appear {
      animation: ringAppear 0.7s cubic-bezier(0.23, 1, 0.32, 1) both;
    }

    /* ============================================================
       PARTÍCULAS / CONEXIONES (efecto de líneas entre nodos)
    ============================================================ */
    .particle-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* ============================================================
       RESPONSIVE (igual que antes, adaptado a colores oscuros)
    ============================================================ */
    @media (max-width: 760px) {
      .rings-container {
        width: 360px;
        height: 360px;
      }

      .center-node {
        width: 100px;
        height: 100px;
      }

      .center-node .title {
        font-size: 0.9rem;
      }

      .center-ring-pulse {
        width: 120px;
        height: 120px;
      }

      .ring .node {
        width: 80px;
        padding: 0.5rem 0.4rem;
      }

      .ring .node .title {
        font-size: 0.7rem;
      }

      .ring .node .sub {
        font-size: 0.6rem;
      }

      .ring .node.quote-node {
        width: 90px;
        padding: 0.5rem;
      }

      .ring .node .quote-text {
        font-size: 0.65rem;
      }
    }

    @media (max-width: 480px) {
      .rings-container {
        width: 280px;
        height: 280px;
      }

      .center-node {
        width: 80px;
        height: 80px;
      }

      .center-node .title {
        font-size: 0.75rem;
      }

      .center-ring-pulse {
        width: 96px;
        height: 96px;
      }

      .ring .node {
        width: 64px;
        padding: 0.3rem 0.2rem;
        border-radius: 12px;
      }

      .ring .node .title {
        font-size: 0.6rem;
      }

      .ring .node .sub {
        font-size: 0.5rem;
      }

      .ring .node.quote-node {
        width: 74px;
        padding: 0.4rem;
      }

      .ring .node .quote-text {
        font-size: 0.55rem;
      }
    }

    /* ============================================================
       UTILITARIOS PARA OCULTAR/MOSTRAR (manejado por JS)
    ============================================================ */
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- HEADER -->
    <header class="header">
      <div class="eyebrow">TPE N.º 2 · Psicología Organizacional · Equipo Pilar + 5</div>
      <h1>Más allá de la teoría</h1>
      <p class="sub">Análisis organizacional transversal — Mapa radial 3D</p>
      <span class="hint">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
          <circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.5"/>
          <path d="M8 2v6l3 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        Haz clic en los nodos con borde para expandir
      </span>
    </header>

    <!-- ESCENA RADIAL -->
    <div class="radial-scene" id="radialScene">
      <div class="rings-container" id="ringsContainer">
        <!-- Círculo central (raíz) -->
        <div class="center-node" id="centerNode" role="button" tabindex="0" aria-expanded="false">
          <div class="title">
            Más allá de la teoría
            <span>Análisis transversal</span>
          </div>
        </div>
        <div class="center-ring-pulse"></div>

        <!-- Aquí se inyectarán los anillos dinámicamente con JS -->
        <div id="ringsWrapper" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;"></div>

        <!-- Canvas para partículas (conexiones) -->
        <canvas class="particle-canvas" id="particleCanvas"></canvas>
      </div>
    </div>
  </div>

  <script>
    // ============================================================
    //  DATOS DE LA ESTRUCTURA (Ampliada con la información del PDF)
    // ============================================================
    const data = {
      id: 'root',
      label: 'Raíz',
      children: [
        {
          id: 'eje1',
          label: 'Eje I',
          title: 'Contexto y desarrollo',
          sub: 'Paradigmas organizacionales',
          detail: 'Análisis mediante los paradigmas de Laloux. Las experiencias de quiebre forzaron a la autoorganización.',
          children: [
            { id: 'e1_1', label: 'Consultora', title: 'Naranja y Verde', sub: 'Eficiencia de negocio y horizontalidad comunitaria' },
            { id: 'e1_2', label: 'Inmobiliaria', title: 'Ámbar y Verde', sub: 'Control administrativo versus empatía comercial' },
            { id: 'e1_3', label: 'Gastronómico', title: 'Transición Naranja', sub: 'Tensión entre jerarquía tradicional y digitalización' }
          ]
        },
        {
          id: 'eje2',
          label: 'Eje II',
          title: 'Clima e interacción',
          sub: 'Comunicación y vínculos',
          detail: 'El clima se co-produce en la matriz deliberativa y la calidad interaccional.',
          children: [
            { id: 'e2_1', label: 'Consultora', title: 'Diálogo Constante', sub: 'Reuniones diarias previenen tensiones reprimidas' },
            { id: 'e2_2', label: 'Inmobiliaria', title: 'Fricción Sistémica', sub: 'Choque entre reglas rígidas y orientación a cierres' },
            { id: 'e2_3', label: 'Gastronómico', title: 'Control Vertical', sub: 'Estabilidad alineada a las directivas del dueño' }
          ]
        },
        {
          id: 'eje3',
          label: 'Eje III',
          title: 'Selección y formación',
          sub: 'Cultura de innovación',
          detail: 'Modelo de Souto: Equilibrio entre selección, reclutamiento y formación.',
          children: [
            { id: 'e3_1', label: 'Consultora', title: 'Fidelización', sub: 'Búsqueda de mentalidad flexible y pensamiento crítico' },
            { id: 'e3_2', label: 'Inmobiliaria', title: 'Habilidades Soft', sub: 'Entrenamiento anual en competencias socioemocionales' },
            { id: 'e3_3', label: 'Gastronómico', title: 'Moldear Perfiles', sub: 'Reclutamiento preferente de jóvenes sin experiencia' }
          ]
        },
        {
          id: 'eje4',
          label: 'Eje IV',
          title: 'La salud mental',
          sub: 'Rol profiláctico',
          detail: 'Prevención del deterioro subjetivo y social ante la tensión laboral.',
          children: [
            { id: 'e4_1', label: 'Mental Care', title: 'Consultora', sub: 'Proyecto de área para contener el desgaste emocional' },
            { id: 'e4_2', label: 'Intervención', title: 'Psicólogo Laboral', sub: 'Dinamización de matrices vinculares y cognitivas' }
          ]
        },
        {
          id: 'citas',
          label: 'Testimonios',
          title: 'Voces del campo',
          sub: 'Entrevistas a líderes',
          children: [
            { id: 'c1', label: 'CEO Consultora', quote: 'No creemos en la retención... creemos en la fidelización.', author: 'Andrea H. Belgrado' },
            { id: 'c2', label: 'Founder Inmobiliaria', quote: 'Señala mucho el error ajeno y pierde de vista que los errores de su equipo son propios.', author: 'Mariana Geimonat' },
            { id: 'c3', label: 'Socio Gastronómico', quote: 'Si apuntan todos para el mismo lado, a todos les va a ir mejor.', author: 'Ramiro Calamera' }
          ]
        }
      ]
    };

    // ============================================================
    //  ESTADO Y REFERENCIAS
    // ============================================================
    const container = document.getElementById('ringsContainer');
    const centerNode = document.getElementById('centerNode');
    const ringsWrapper = document.getElementById('ringsWrapper');
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');

    let particles = [];
    let animationFrame = null;
    let expandedNodes = new Set();

    // ============================================================
    //  UTILIDADES
    // ============================================================
    function degToRad(deg) {
      return deg * Math.PI / 180;
    }

    // ============================================================
    //  DIBUJAR PARTÍCULAS (conexiones 3D entre nodos)
    // ============================================================
    function initParticles() {
      const rect = container.getBoundingClientRect();
      canvas.width = rect.width || 520;
      canvas.height = rect.height || 520;
      particles = [];

      for (let i = 0; i < 30; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 2 + 1,
          vx: (Math.random() - 0.5) * 0.4,
          vy: (Math.random() - 0.5) * 0.4,
          color: `rgba(0, 212, 255, ${Math.random() * 0.3 + 0.1})`
        });
      }

      drawParticles();
    }

    function drawParticles() {
      if (!ctx) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Dibujar líneas entre partículas cercanas
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < 120) {
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.strokeStyle = `rgba(0, 212, 255, ${0.08 * (1 - dist / 120)})`;
            ctx.lineWidth = 0.5;
            ctx.stroke();
          }
        }
      }

      // Dibujar partículas
      particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
      });

      // Actualizar posiciones
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
      });

      animationFrame = requestAnimationFrame(drawParticles);
    }

    // ============================================================
    //  CREAR ANILLOS Y NODOS (dinámico)
    // ============================================================
    function buildRings() {
      // Limpiar anillos anteriores
      ringsWrapper.querySelectorAll('.ring').forEach(r => r.remove());

      const children = data.children;
      if (!children || children.length === 0) return;

      const rect = container.getBoundingClientRect();
      const baseSize = Math.min(rect.width, rect.height) || 500;
      const radius = baseSize * 0.32;

      const ringDiv = document.createElement('div');
      ringDiv.className = 'ring appear';
      ringDiv.style.width = '100%';
      ringDiv.style.height = '100%';
      ringDiv.style.pointerEvents = 'none';
      ringsWrapper.appendChild(ringDiv);

      const total = children.length;
      const angleStep = (2 * Math.PI) / total;
      const startAngle = -Math.PI / 2; // empezar arriba

      children.forEach((child, index) => {
        const angle = startAngle + index * angleStep;
        const x = radius * Math.cos(angle);
        const y = radius * Math.sin(angle);

        const wrap = document.createElement('div');
        wrap.className = 'node-wrap';
        wrap.style.left = `calc(50% + ${x}px)`;
        wrap.style.top = `calc(50% + ${y}px)`;
        wrap.style.transform = 'translate(-50%, -50%)';
        wrap.style.pointerEvents = 'auto';
        wrap.style.zIndex = 2;

        const isQuote = child.children && child.children.length > 0 && child.children[0].quote;
        const isExpandable = child.children && child.children.length > 0 && !isQuote;
        const isLeaf = !isExpandable && !isQuote;

        const node = document.createElement('div');
        node.className = 'node';
        if (isLeaf) node.classList.add('leaf');
        if (isExpandable) {
          node.classList.add('expandable');
          if (child.id === 'citas') node.classList.add('pink');
        }
        if (isQuote) node.classList.add('quote-node');

        if (isQuote) {
          const q = child.children[0];
          node.innerHTML = `
            <span class="quote-mark">"</span>
            <div class="quote-text">${q.quote}</div>
            <div class="quote-author">${q.author}</div>
          `;
          node.dataset.quotes = JSON.stringify(child.children);
          node.dataset.id = child.id;
          node.classList.add('expandable', 'pink');
        } else {
          const label = child.label || '';
          const title = child.title || '';
          const sub = child.sub || '';
          node.innerHTML = `
            <div class="label">${label}</div>
            <div class="title">${title}</div>
            <div class="sub">${sub}</div>
            ${isExpandable ? '<span class="chevron">▼</span>' : ''}
          `;
          if (isExpandable) {
            node.dataset.id = child.id;
            node.dataset.children = JSON.stringify(child.children || []);
          }
        }

        // Si es expandible (tiene hijos y no es cita, o es cita con varias)
        if (isExpandable || (isQuote && child.children && child.children.length > 1)) {
          node.classList.add('expandable');
          if (child.id === 'citas' || isQuote) node.classList.add('pink');
          node.dataset.id = child.id;
          node.dataset.children = JSON.stringify(child.children || []);

          node.addEventListener('click', function(e) {
            e.stopPropagation();
            toggleNode(this, child.id);
          });

          node.setAttribute('role', 'button');
          node.setAttribute('tabindex', '0');
          node.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              this.click();
            }
          });
        }

        wrap.appendChild(node);
        ringDiv.appendChild(wrap);
      });

      setTimeout(initParticles, 100);
    }

    // ============================================================
    //  TOGGLE NODO (expansión con animación 3D)
    // ============================================================
    function toggleNode(nodeElement, id) {
      if (nodeElement.classList.contains('open')) {
        closeNode(nodeElement, id);
      } else {
        openNode(nodeElement, id);
      }
    }

    function openNode(nodeElement, id) {
      if (nodeElement.classList.contains('open')) return;

      let childrenData = [];
      try {
        const raw = nodeElement.dataset.children;
        if (raw) childrenData = JSON.parse(raw);
      } catch (e) {}

      if (!childrenData || childrenData.length === 0) return;

      nodeElement.classList.add('open');
      expandedNodes.add(id);

      const ringDiv = document.createElement('div');
      const ringId = 'ring-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4);
      ringDiv.id = ringId;
      ringDiv.className = 'ring appear';
      ringDiv.style.width = '100%';
      ringDiv.style.height = '100%';
      ringDiv.style.pointerEvents = 'none';
      ringDiv.dataset.parentId = id;
      ringsWrapper.appendChild(ringDiv);

      const rect = container.getBoundingClientRect();
      const baseSize = Math.min(rect.width, rect.height) || 500;
      const radius = baseSize * 0.22;

      const parentRect = nodeElement.getBoundingClientRect();
      const containerRect = container.getBoundingClientRect();
      const parentCenterX = parentRect.left + parentRect.width / 2 - containerRect.left;
      const parentCenterY = parentRect.top + parentRect.height / 2 - containerRect.top;

      const total = childrenData.length;
      const angleStep = (2 * Math.PI) / total;
      const startAngle = -Math.PI / 2;

      childrenData.forEach((child, index) => {
        const angle = startAngle + index * angleStep;
        const x = radius * Math.cos(angle) + parentCenterX - containerRect.width / 2;
        const y = radius * Math.sin(angle) + parentCenterY - containerRect.height / 2;

        const wrap = document.createElement('div');
        wrap.className = 'node-wrap';
        wrap.style.left = `calc(50% + ${x}px)`;
        wrap.style.top = `calc(50% + ${y}px)`;
        wrap.style.transform = 'translate(-50%, -50%)';
        wrap.style.pointerEvents = 'auto';
        wrap.style.zIndex = 3;

        const node = document.createElement('div');
        node.className = 'node leaf';

        if (child.quote) {
          node.className = 'node quote-node';
          node.innerHTML = `
            <span class="quote-mark">"</span>
            <div class="quote-text">${child.quote}</div>
            <div class="quote-author">${child.author || ''}</div>
          `;
        } else {
          node.innerHTML = `
            <div class="label">${child.label || ''}</div>
            <div class="title">${child.title || ''}</div>
            <div class="sub">${child.sub || child.detail || ''}</div>
          `;
        }

        wrap.appendChild(node);
        ringDiv.appendChild(wrap);
      });

      container.classList.add('is-rotated');
      nodeElement.dataset.childRingId = ringId;
      setTimeout(initParticles, 200);
    }

    function closeNode(nodeElement, id) {
      if (!nodeElement.classList.contains('open')) return;

      const ringId = nodeElement.dataset.childRingId;
      if (ringId) {
        const ring = document.getElementById(ringId);
        if (ring) ring.remove();
      }

      nodeElement.classList.remove('open');
      expandedNodes.delete(id);

      if (expandedNodes.size === 0) {
        container.classList.remove('is-rotated');
      }

      setTimeout(initParticles, 200);
    }

    // ============================================================
    //  INICIALIZACIÓN
    // ============================================================
    function init() {
      const rect = container.getBoundingClientRect();
      canvas.width = rect.width || 520;
      canvas.height = rect.height || 520;

      buildRings();

      centerNode.addEventListener('click', function() {
        const openNodes = document.querySelectorAll('.ring .node.expandable.open');

        if (openNodes.length > 0) {
          openNodes.forEach(n => {
            if (n.dataset.id) {
              closeNode(n, n.dataset.id);
            }
          });
        } else {
          const firstNode = document.querySelector('.ring .node.expandable:not(.pink)');
          if (firstNode) {
            firstNode.click();
          }
        }
      });

      initParticles();

      window.addEventListener('resize', () => {
        const rect = container.getBoundingClientRect();
        canvas.width = rect.width || 520;
        canvas.height = rect.height || 520;
        initParticles();
      });
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
